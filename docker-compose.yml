# SMP — backend (FastAPI) + frontend (React, served by nginx)
#
#   docker compose up --build        then open http://localhost:5173
#
# The database is external (Neon PostgreSQL). DATABASE_URL, JWT_SECRET, VAULT_KEY (and SMTP_*, DEEPSEEK_*)
# come from backend/.env when run locally, or from .env next to this file — which is where a host such as
# Dokploy writes its Environment settings. Neither file is committed, and neither is required.

services:
  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
      - path: ./.env
        required: false
    environment:
      # public address of the app: used in emailed sign-in links and for CORS
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
    ports:
      - "8000:8000"   # API + Swagger UI at http://localhost:8000/docs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
